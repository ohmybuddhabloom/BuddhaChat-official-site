<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuddhaChat</title>
    <meta name="description" content="BuddhaChat connects Buddhist video teachings, scripture reading, music, and community in one calm digital space." />
    <meta property="og:image" content="https://www.buddhachat.online/share/official-card-v1.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.buddhachat.online/share/official-card-v1.jpg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const isDownload = /^\/download(?:\/|$)/.test(location.pathname)
        const preload = document.createElement('link')
        preload.rel = 'preload'
        preload.as = 'image'
        preload.fetchPriority = 'high'
        if (isDownload) {
          preload.href = matchMedia('(min-width: 761px)').matches
            ? '/buddhachat-download-hero-desktop-v3.avif'
            : '/buddhachat-download-hero-mobile-v3.avif'
        } else {
          preload.href = '/kling-buddha-scroll-poster.jpg'
        }
        document.head.append(preload)

        if (!isDownload) {
          const scene = document.createElement('link')
          scene.rel = 'preload'
          scene.as = 'fetch'
          scene.href = '/editor-state/scene.json'
          scene.crossOrigin = 'anonymous'
          document.head.append(scene)
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="site-fonts" rel="stylesheet" media="not all" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;800&display=swap" />
    <script>
      if (!/^\/download(?:\/|$)/.test(location.pathname)) {
        document.getElementById('site-fonts').media = 'all'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
