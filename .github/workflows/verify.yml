name: Verify

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --maxWorkers=2

      - name: Lint source
        run: npx eslint src

      - name: Build site
        run: npm run build
